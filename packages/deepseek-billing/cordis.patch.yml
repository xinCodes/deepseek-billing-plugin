# DeepSeek 余额/会话费用插件（bundle 补丁层）。
# 安装本包（如 `dsh plugin add @deepseek-ai/dsh-deepseek-billing`）后，
# 该补丁随 bundle 自动叠加：宿主半边注册余额路由，客户端半边挂载 UI。
# 两行都按包名挂载，不包含任何机器相关路径。

- insert:
    - id: deepseek-billing
      name: '@deepseek-ai/dsh-deepseek-billing'
      config:
        # 余额接口地址（官方公共 API）。
        baseURL: 'https://api.deepseek.com'
        # API Key 来源：环境变量 / credentials 域引用；也可直接填字面量 apiKey。
        apiKeyEnv: DEEPSEEK_API_KEY

    - id: ui-deepseek-billing
      name: '@deepseek-ai/dsh-client-ui-deepseek-billing'
